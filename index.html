<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <title>Displacement</title>
  </head>
  <body>
    <a-scene fog="type: exponential">
      <a-assets>
        <img id="moon" src="ldem_3_8bit.jpg" />
        <img id="moon_displacement" src="ldem_3_8bit.jpg" />
        <img id="sky" src="starglobe_equirectangular_reversed_16x8k.jpg">
      </a-assets>
  
      <a-sphere 
        src="#moon" 
        displacement-map="#moon_displacement" 
        displacement-bias="0.5"
        displacement-scale="0.12"            
        segments-height="128"
        segments-width="128"
        position="0 2 -6" 
        rotation="0 45 45"
        scale="2 2 2"
        >
     
    <a-sky src="#sky"></a-sky>
  </body>
</html>
